  latest_post_title: LifeMine Announces First Participant Dosed in First-in-human Phase 1 Clinical Trial of LIFE-001
  team_records: 15
  media_items: 117
  open_roles: 2
  note: >
    Counts read from X-WP-Total headers and the careers `meta.total`. Recorded as a dated
    observation so a later run can measure drift.
stability_assessment:
  grade: incidental
  detail: >
    Both surfaces are byproducts of the platforms LifeMine buys — a WordPress site and a
    Greenhouse job board — rather than an intentional API programme. They are genuinely useful and
    genuinely public, but a consumer should assume no compatibility promise, no notice period and
    no support channel for breakage.
