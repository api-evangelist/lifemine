aid: lifemine
name: LifeMine
description: >-
  LifeMine (LifeMine Therapeutics) is a clinical-stage biopharmaceutical company pioneering
  Top-Down Drug Discovery, mining the fungal biosphere for genetically encoded small molecules and
  developing them into precision medicines for immune-mediated disease and organ transplant
  rejection. Founded in 2017 by Gregory Verdine, Richard Klausner and WeiQing Zhou, the company is
  headquartered in Watertown, Massachusetts with sites in Gloucester, Massachusetts and Basel,
  Switzerland, and has raised more than $320 million. Its lead programme, LIFE-001, is a
  structurally novel calcineurin inhibitor that entered a first-in-human Phase 1 trial in April
  2025. LifeMine publishes no developer portal and no API documentation, and its drug-discovery
  platform is not exposed publicly. It does, however, operate two genuinely public, anonymous,
  machine-readable read APIs as byproducts of the platforms it runs: a WordPress REST API serving
  its news, pages, media and a structured leadership/board record set, and a Greenhouse job board
  API serving its open roles, departments and offices.
