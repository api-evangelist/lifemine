apis:
- aid: lifemine:content
  name: LifeMine Website Content API
  description: >-
    Anonymous read API over LifeMine's corporate site content, served by WordPress at
    https://lifeminetx.com/wp-json. Carries 24 news items (press releases, publications,
    in-the-news coverage and thought leadership), 9 static pages, 117 media assets, and a `team`
    custom post type holding 15 structured leadership, founder and board-of-directors records with
    biographies and headshots. 203 routes are registered across 10 namespaces. Reads require no
    credentials; writes require a WordPress credential that is not issued to the public. Resources
    self-describe via HTTP OPTIONS, which returns real JSON Schema per collection. This is a
    site-content API, not a scientific or clinical one.
  humanURL: https://lifeminetx.com/
  baseURL: https://lifeminetx.com/wp-json
  tags:
  - Content
  - News
  - People
  - Media
  - WordPress
