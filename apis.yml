x-enrichment-notes:
  no_fabrication_record: >-
    The following canonical pointers are deliberately ABSENT because the underlying thing does not
    exist, and each absence was verified rather than assumed: AgentCard (both
    /.well-known/agent-card.json and /.well-known/agent.json returned 404); SecurityTxt and
    Security (/.well-known/security.txt returned 404, no disclosure page or bug bounty found);
    Compliance and TrustCenter (no trust centre, no published certifications); SDKs and Packages
    (no first-party client library in any registry); StatusPage and Deprecation (no status page,
    no deprecation policy, no Sunset headers); Idempotency (no idempotency key anywhere in the 203
    registered routes or the Greenhouse surface); AsyncAPI and Webhooks (no event or webhook
    surface); OAuthScopes (no OAuth); RateLimits (no published limits, no rate-limit headers);
    ChangeLog, CLI, Sandbox and Components (none published); DeclineCodes (not a payments
    provider); Documentation, APIReference, GettingStarted and DeveloperPortal (LifeMine publishes
    no API documentation of any kind — pointing these at the upstream WordPress or Greenhouse
    handbooks would credit LifeMine for someone else's work); TermsOfService (/terms/ and
    /terms-of-use/ both 404); GitHubOrganization (github.com/LifeMine resolves but is empty,
    undescribed and unverifiable as this company); Postman, Pricing and SignUp (not applicable to
