  - type: Overlay
    url: overlays/lifemine-content-overlay.yaml
  - type: JSONSchema
    url: json-schema/lifemine-posts-schema.json
  - type: JSONSchema
    url: json-schema/lifemine-team-schema.json
  - type: Examples
    url: examples/lifemine-posts-example.json
  - type: GraphQL
    url: graphql/lifemine-graphql.yml
- aid: lifemine:careers
  name: LifeMine Careers API
  description: >-
    Anonymous read API over LifeMine's open roles, hiring departments and offices, served by
    Greenhouse under the board token `lifeminetx`. Every GET is public and unauthenticated.
    Returns full HTML job descriptions on request, application-form questions, per-role GDPR
    data-compliance blocks, and AI-disclosure fields including an applicant opt-out URL. Two open
    roles, 32 departments and three offices (Basel CH, Gloucester MA, Watertown MA) were observed
    on 2026-08-04. The host is Greenhouse's; the board content is LifeMine's.
  humanURL: https://job-boards.greenhouse.io/lifeminetx
  baseURL: https://boards-api.greenhouse.io/v1/boards/lifeminetx
  tags:
  - Careers
  - Jobs
  - Hiring
  properties:
  - type: OpenAPI
    url: openapi/lifemine-careers-openapi.yml
  - type: Overlay
    url: overlays/lifemine-careers-overlay.yaml
  - type: Examples
    url: examples/lifemine-careers-jobs-example.json
