notes:
  write_tools_excluded: >
    Every write operation in openapi/lifemine-content-openapi.yml requires a WordPress credential
    that is not issued to the public, so no write tool is proposed. A candidate MCP server over
    this provider is read-only by construction.
  input_schemas: >
    Each tool's real input contract is the `parameters` block of its backing operation in the
    referenced OpenAPI — those parameters were read from the host's own route index, so they are
    accurate rather than guessed. `_fields` is the parameter that matters most for token budget on
    the content surface.
  rate_pacing: >
    No rate-limit contract is published. robots.txt asks for Crawl-delay: 10, which is the only
    pacing signal either host gives; see conventions/lifemine-conventions.yml.
