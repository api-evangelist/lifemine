cross_surface_note: >
  The two surfaces do not join. There is no shared identifier between a WordPress `team` record
  and a Greenhouse `job`, and no LifeMine-side entity links them. `office` (Basel CH, Gloucester
  MA, Watertown MA) and the site's stated locations overlap semantically only.

id_conventions:
  content: Sequential WordPress integer ids; slugs are stable, human-readable and used in public URLs.
  careers: Greenhouse int64 ids (e.g. 8587930002); `internal_job_id` is a separate id from the board `id`.

