      sections: 0
      note: >
        32 departments against 2 open roles — most departments are empty. Read `jobs[]` per
        department rather than treating the taxonomy as a headcount signal.
- target: $.info
  update:
    x-signal-value: >
      For a clinical-stage biotech, open roles are the highest-signal public data the company
      emits: hiring telegraphs which programmes are moving. Both roles observed were in
      Watertown, Massachusetts — Clinical Operations and Discovery Biology/Proteomics.
- target: $.info
  update:
