- target: $.paths['/jobs/{job_id}'].get
  update:
    x-apievangelist-note: >
      Carries `ai_disclaimer`, `include_ai_disclaimer` and `ai_opt_out_request_url`. An agent
      acting for a candidate should surface the opt-out URL to the person — it is how they decline
      AI-assisted evaluation of their application.
- target: $.paths['/jobs'].get
  update:
    x-apievangelist-note: >
      No pagination and no filtering; the whole collection returns every call. `content` is opt-IN,
      so the default response is light. Poll and diff on `id`, using `updated_at` to catch edits.
- target: $.info
  update:
    x-candidate-handling: >
      Application submission is a separate authenticated Greenhouse endpoint and is deliberately
      excluded from this document. Never collect or transmit candidate data through this surface;
      route people to the role's `absolute_url`.
