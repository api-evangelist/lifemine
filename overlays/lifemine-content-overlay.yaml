      observed_on: '2026-08-04'
      posts: 24
      pages: 9
      media: 117
      team: 15
      categories: 4
      team_categories: 3
      registered_routes_total: 203
      namespaces_total: 10
- target: $.info
  update:
    x-conventions: conventions/lifemine-conventions.yml
    x-errors: errors/lifemine-problem-types.yml
    x-data-model: data-model/lifemine-data-model.yml
    x-lifecycle: lifecycle/lifemine-lifecycle.yml
    x-conformance: conformance/lifemine-conformance.yml
    x-agentic-access: agentic-access/lifemine-agentic-access.yml
- target: $.info
  update:
    x-rate-limit-guidance:
      published: false
      headers: none
      pacing_signal: 'robots.txt Crawl-delay: 10'
      note: Expect silent edge throttling from Cloudflare/WP Engine/Wordfence rather than a 429 contract.
- target: $.components.securitySchemes
  update:
    x-public-read: >
      No security scheme applies to read operations. The discovery document advertises
      "authentication": [] — there is no public credential to obtain, and none is needed.
- target: $.paths['/wp/v2/team'].get
  update:
    x-apievangelist-note: >
      The most valuable operation on this API. `team` is a custom post type, so LifeMine's
      leadership, founders and board are structured records rather than HTML — see
      skills/lifemine-map-leadership.md. People hold multiple taxonomy terms; deduplicate by id.
- target: $.paths['/wp/v2/posts'].get
  update:
    x-apievangelist-note: >
      Mixes LifeMine's own press releases with third-party earned media. Resolve `categories`
      against /wp/v2/categories before attributing anything to the company.
- target: $.paths['/wp/v2/search'].get
  update:
    x-apievangelist-note: >
      Returns typed stubs across posts, pages and team — not bodies. Follow up with the
      per-resource get operation.
