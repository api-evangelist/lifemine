info:
  title: API Evangelist enhancements for the LifeMine Website Content API
  version: 1.0.0
extends: openapi/lifemine-content-openapi.yml
x-generated: '2026-08-04'
x-method: generated
x-source: >
  Records the enhancements API Evangelist applied on top of the WordPress route index fetched from
  https://lifeminetx.com/wp-json/. The harvested index is preserved unmodified at
  openapi/_original/lifemine-wp-json-index.json; this overlay documents what we added so the
  provider-published material and our additions stay separable.
actions:
- target: $.info
  update:
    x-apievangelist-profile: https://apievangelist.com/
    x-apievangelist-repo: https://github.com/api-evangelist/lifemine
    x-derivation-note: >
      Derived, not published. Paths, methods, parameter names, types, defaults, enums and
      descriptions were converted mechanically from the host's self-describing route index.
      Response schemas were harvested verbatim via HTTP OPTIONS on each collection.
    x-provider-publishes-spec: false
- target: $.info
  update:
    x-surface-class: incidental
    x-surface-note: >
      This API is a byproduct of LifeMine running WordPress, not an intentional API product. It is
      genuinely public and anonymous, but carries no compatibility promise, no SLA, no status page
      and no support channel.
- target: $.info
  update:
    x-scope-exclusions:
      excluded_namespaces: [yoast/v1, wordfence/v1, wpe/cache-plugin/v1, wpe_sign_on_plugin/v1]
      reason: >
        Real registered routes on the live host, but third-party plugin admin control planes
        rather than LifeMine's content surface. All 203 routes remain in
        openapi/_original/lifemine-wp-json-index.json.
      included_namespaces: [wp/v2, oembed/1.0, wp-abilities/v1, wp-site-health/v1, wp-block-editor/v1, customgf/v2]
